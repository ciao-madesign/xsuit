<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xsuit</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main>
      <h1>xsuit</h1>
      <div class="row">
        <label for="enabled">Enabled</label>
        <input type="checkbox" id="enabled" />
      </div>
      <fieldset>
        <legend class="muted">Profile</legend>
        <div class="row">
          <label><input type="radio" name="profile" value="original" /> Original</label>
        </div>
        <div class="row">
          <label><input type="radio" name="profile" value="western" /> Western</label>
        </div>
        <div class="row">
          <label><input type="radio" name="profile" value="china" /> China</label>
        </div>
        <div class="row">
          <label><input type="radio" name="profile" value="hybrid" /> Hybrid (preliminary)</label>
        </div>
      </fieldset>
      <div class="row">
        <label for="depth">Depth</label>
        <select id="depth">
          <option value="visual">Visual</option>
          <option value="structural">Structural</option>
        </select>
      </div>
      <div class="row">
        <label for="always">Always on this site</label>
        <input type="checkbox" id="always" />
      </div>
      <div id="status" class="status" role="status"></div>
      <div class="row">
        <button id="apply" class="primary" type="button">Apply now</button>
        <button id="restore" type="button">Restore original</button>
      </div>
      <h2>Audit</h2>
      <div class="row">
        <button id="measure" type="button">Measure this page</button>
        <button id="download" type="button" disabled>Download JSON</button>
      </div>
      <table id="metrics" class="metrics" hidden></table>
      <div class="row">
        <span class="muted">Runs locally. Nothing is sent anywhere.</span>
        <a href="options.html" id="open-options" class="muted">Options</a>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
