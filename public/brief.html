<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n-title="brief.title">Localization brief</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      main.brief {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      .change {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        margin: 12px 0;
        break-inside: avoid;
      }
      .change h3 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      .change pre {
        white-space: pre-wrap;
        margin: 6px 0;
        font-size: 12px;
      }
      .notes {
        background: var(--warn-bg);
        border-radius: 8px;
        padding: 10px 14px;
      }
      @media print {
        .actions {
          display: none;
        }
        body {
          background: #fff;
          color: #000;
        }
      }
    </style>
  </head>
  <body>
    <main class="brief">
      <h1 data-i18n="brief.title">Localization brief</h1>
      <p id="subtitle" class="muted"></p>
      <p id="summary"></p>
      <section class="notes" aria-labelledby="readFirst">
        <h2 id="readFirst" data-i18n="brief.readFirst">Read this first</h2>
        <ul>
          <li data-i18n="brief.note1"></li>
          <li data-i18n="brief.note2"></li>
          <li data-i18n="brief.note3"></li>
        </ul>
      </section>
      <section id="changes"></section>
      <section id="notApplied" hidden>
        <h2 data-i18n="brief.notApplied">Not applied</h2>
        <ul id="notAppliedList"></ul>
      </section>
      <div class="row actions">
        <button id="print" type="button" class="primary" data-i18n="brief.print">
          Print or save as PDF
        </button>
        <button id="save" type="button" data-i18n="brief.save">Save as file</button>
      </div>
      <p class="muted" data-i18n="brief.footer"></p>
    </main>
    <script src="brief.js"></script>
  </body>
</html>
