<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xsuit options</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main style="max-width: 520px">
      <h1>xsuit options</h1>
      <h2>Sites where xsuit always runs</h2>
      <p class="muted">
        xsuit runs automatically only on these sites. Everywhere else it acts only when you press a
        button in the popup. Add a site from the popup ("Always on this site").
      </p>
      <ul id="sites"></ul>
      <h2>Reset</h2>
      <button id="reset" type="button">Restore default settings</button>
      <h2>Privacy</h2>
      <p class="muted">Everything runs locally. xsuit sends no data anywhere.</p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
